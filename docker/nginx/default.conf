# Only the loopback-published gateway is reachable from the host.
# Both applications share one origin so phpMyAdmin may be framed safely.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 [::1];
    client_max_body_size 128m;

    location = /phpmyadmin {
        return 302 /phpmyadmin/;
    }

    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_cookie_path ~^/$ /phpmyadmin/;
        proxy_read_timeout 320s;
        proxy_redirect default;
    }

    location / {
        proxy_pass http://app/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 320s;
    }
}
