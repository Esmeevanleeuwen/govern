# Only the loopback-published gateway is reachable from the host.
# Both applications share one origin so phpMyAdmin may be framed safely.
# Docker assigns new addresses when Compose recreates a backend. Refresh the
# service names instead of retaining an old address until nginx restarts.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;

# Module imports keep stable URLs across local updates. Revalidate every asset
# so cached browser modules are checked against the current backend version.
# An empty header value leaves HTML and API cache policies to the application.
map $uri $govern_asset_cache_control {
    default "";
    ~^/assets/ "no-cache";
}

upstream govern_app {
    zone govern_app 64k;
    server app:80 resolve;
}

upstream govern_phpmyadmin {
    zone govern_phpmyadmin 64k;
    server phpmyadmin:80 resolve;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 [::1];
    # This listener remains loopback-only on the host. Client-supplied
    # X-Forwarded-Proto never changes its HTTP/HTTPS interpretation.
    set $govern_protocol $scheme;
    include /etc/nginx/govern-routes.inc;
}
